name: Address PR 2690 root-key review

on:
  push:
    branches:
      - ci/pr-2690-root-key-review

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-upgrade-preserve-malformed-views
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply root-key review fix
        run: |
          python - <<'PY'
          from pathlib import Path

          context_path = Path('core/wren/src/wren/context.py')
          text = context_path.read_text(encoding='utf-8')
          old = '''    else:\n        raw_views = raw.get("views") if isinstance(raw, dict) else None\n        if raw_views is not None and not isinstance(raw_views, list):\n'''
          new = '''    else:\n        raw_views = None\n        if isinstance(raw, dict):\n            unexpected_keys = set(raw) - {"views"}\n            if unexpected_keys:\n                problems.append(\n                    "views.yml: unsupported root keys would be discarded: "\n                    + ", ".join(sorted(str(key) for key in unexpected_keys))\n                )\n            raw_views = raw.get("views")\n\n        if raw_views is not None and not isinstance(raw_views, list):\n'''
          if text.count(old) != 1:
              raise SystemExit(f'context root-key anchor count: {text.count(old)}')
          context_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests_path = Path('core/wren/tests/unit/test_context.py')
          tests = tests_path.read_text(encoding='utf-8')
          anchor = '''\n\ndef test_plan_upgrade_v1_to_v2_rejects_nameless_view_without_data_loss(tmp_path):\n'''
          regression = '''\n\n@pytest.mark.parametrize(\n    "views_yml",\n    [\n        "legacy_setting: value\\n",\n        "views: []\\nlegacy_setting: value\\n",\n    ],\n)\ndef test_plan_upgrade_v1_to_v2_rejects_unpreserved_views_root_keys(\n    tmp_path, views_yml\n):\n    """Root fields migration cannot carry forward must block source deletion."""\n    _make_v1_project(tmp_path)\n    views_file = tmp_path / "views.yml"\n    views_file.write_text(views_yml, encoding="utf-8")\n    source_contents = _snapshot_v1_sources(tmp_path)\n\n    from wren.context import UpgradeError as _UE  # noqa: PLC0415\n\n    with pytest.raises(_UE, match="unsupported root keys"):\n        plan_upgrade(tmp_path, target_version=2)\n\n    _assert_v1_sources_unchanged(tmp_path, source_contents)\n'''
          if tests.count(anchor) != 1:
              raise SystemExit(f'test root-key insertion anchor count: {tests.count(anchor)}')
          tests_path.write_text(tests.replace(anchor, regression + anchor, 1), encoding='utf-8')
          PY

      - name: Validate focused change
        run: |
          python -m pip install pyyaml ruff
          python -m py_compile core/wren/src/wren/context.py core/wren/tests/unit/test_context.py
          ruff format core/wren/src/wren/context.py
          ruff check core/wren/src/wren/context.py
          python - <<'PY'
          import importlib.util
          import sys
          import tempfile
          from pathlib import Path

          module_path = Path('core/wren/src/wren/context.py')
          spec = importlib.util.spec_from_file_location('wren_context_2690_root_keys', module_path)
          ctx = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = ctx
          spec.loader.exec_module(ctx)

          for payload in ('legacy_setting: value\n', 'views: []\nlegacy_setting: value\n'):
              with tempfile.TemporaryDirectory() as td:
                  root = Path(td)
                  (root / 'views.yml').write_text(payload, encoding='utf-8')
                  try:
                      ctx._reject_malformed_v1_views(root)
                  except ctx.UpgradeError as exc:
                      assert 'unsupported root keys' in str(exc)
                  else:
                      raise AssertionError(f'accepted unpreserved root key: {payload!r}')
          PY

      - name: Commit review fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "scarn"
          git config user.email "NNoradrenaline@users.noreply.github.com"
          git add core/wren/src/wren/context.py core/wren/tests/unit/test_context.py
          git diff --cached --check
          git commit -m "fix(context): reject unpreserved views root keys"
          git push "https://x-access-token:${GH_TOKEN}@github.com/NNoradrenaline/WrenAI.git" HEAD:fix/context-upgrade-preserve-malformed-views
