# trigger: yaml parse error review v2
name: Address PR 2690 YAML parse error review

on:
  push:
    branches:
      - ci/pr-2690-root-key-review

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-upgrade-preserve-malformed-views
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify YAML parse error review fix already landed
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('core/wren/src/wren/context.py').read_text(encoding='utf-8')
          assert 'except (TypeError, yaml.YAMLError) as exc:' in text
          assert 'Cannot upgrade: invalid views.yml:' in text
          tests = Path('core/wren/tests/unit/test_context.py').read_text(encoding='utf-8')
          assert 'test_plan_upgrade_v1_to_v2_wraps_yaml_loader_errors_without_data_loss' in tests
          assert 'test_apply_upgrade_v1_to_v2_rechecks_yaml_loader_errors_before_writing' in tests
          PY
